<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captura · Pagelio</title><link rel="stylesheet" href="styles.css"></head><body><main class="workspace"><header class="brand"><img src="assets/icon-48.png" width="38" height="38" alt=""><div><strong>Pagelio<span class="dot">.</span></strong><p>Um pedacinho da web. Seu.</p></div><span class="badge">CAPTURA</span></header><h1>Pronta para guardar<span class="dot">.</span></h1><p id="status" class="status" role="status" aria-live="polite">Capturando… mantenha a página de origem em primeiro plano.</p><div class="toolbar" id="capture-controls" hidden><select id="format" aria-label="Formato"><option value="image/png">PNG · melhor qualidade</option><option value="image/jpeg">JPG · arquivo menor</option><option value="image/webp">WebP · formato compacto</option></select><button class="primary" id="save">↓ Salvar imagem</button><span id="dimensions" class="muted"></span></div><canvas id="preview" hidden></canvas><p class="notice">A captura é processada neste navegador. Nenhum arquivo é enviado para servidores do Pagelio.</p></main><script type="module" src="capture.js"></script></body></html>
